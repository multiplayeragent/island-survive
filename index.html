<script type="module">
/* ═══ ISLAND SURVIVE · a Multiplayer Agent starter ═══════════════════════════════════════
 * Chop, craft, keep the fire burning and survive the night. Co-op, 1–6 players; bots help.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ the day/night cycle, trees and rocks, crabs, fire, recipes, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   WORLD MEMORY .. how the camp survives the room emptying (same code as voxel-builders)
 *   ISLAND ........ where the trees and rocks are, the ground, the sea, drawing trees/rocks
 *   CAMP .......... campfires and fences: how they are packed into state, and drawn
 *   SURVIVORS ..... the survivor model, tools, name tags
 *   CRABS ......... how night crabs are packed into state, and how they are drawn (instanced)
 *   EFFECTS ....... particles, sounds, the sky (day, dusk, night, dawn)
 *   ISLAND (HOST) . the clock, crabs' brains, bites, bots, every intent. Only the host runs it.
 *   ME ............ walking, chopping, crafting, building, getting knocked out
 *   HUD ........... clock, hearts, backpack, recipes, the knocked-out card, leaderboard
 *   INPUT ......... keyboard + mouse, thumb stick and USE button on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code, the HOST's browser runs the island):
 *   - Each player writes its OWN entity: `p` (one JSON field: x, z, facing, hearts, knocked
 *     out, swing counter, tool) about 10 times a second, `bag` (wood, stone, tools) when it
 *     changes, `hb` (heartbeat) once a second, `n`/`c` (name, color) once, `st` (night streak).
 *     Each player owns its own backpack and hearts.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `sky`   {v, day, phase: day|night, endsAt}: the clock, written only on a change
 *       `nodes` how many swings each tree and rock has left, and when fallen ones regrow
 *       `camp`  every campfire (x, z, when its fuel runs out) and fence (x, z, turn, health)
 *       `rev`   how many things PEOPLE have built (world memory compares it)
 *       `crabs` every night crab, 10 times a second; `bots` the AI survivors, 10 times a second
 *     A new host adopts all of it from state and carries on: same night, same crabs.
 *   - Everyone else sends intents: "hit" {i} (a swing at tree/rock i: you add the wood or
 *     stone to your own bag, the host takes a swing off the node), "hitc" {i, d, x, z} (a
 *     swing at crab i), "fuel" {x, z} (a log into the fire there) and "build" {k, x, z, r}
 *     (a fence or campfire). The host checks and writes the result; its own swings apply directly.
 *   - Crabs bite by event: the host sends "bite" {to, d} and only the bitten player takes the
 *     hearts off. The host bites bots directly.
 *   - The camp and the day count outlive the room through WORLD MEMORY (see that section).
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "night-streak": the most nights in a row you lasted without being knocked out.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  island: 31,            // radius of the grass; the beach runs on to `beach`
  beach: 35,
  trees: 58, rocks: 22,  // resource spots on the island (the same spots for everyone)
  treeHits: 3,           // swings before a tree falls
  rockHits: 3,           // swings before a rock is mined out
  regrowMs: 45000,       // a fallen tree or mined rock comes back after this long
  firstDayMs: 50000,     // the first day on a new island
  dayMs: 70000,          // later days
  nightMs: 50000,        // every night
  duskMs: 7000,          // dusk and dawn fade over this long
  speed: 6,              // walking speed, units/s
  reach: 1.7,            // how far a swing reaches (the spear adds `spearReach`)
  spearReach: 0.8,
  swingMs: 420,          // ms between swings while Use is held
  hp: 5,                 // hearts
  healMs: 4000,          // ms per heart while you stand in firelight
  wakeMs: 12000,         // knocked out this long, you wake up by the fire on your own
  fuelPerWood: 14,       // seconds of fire one log adds
  maxFuel: 100,          // most seconds of fuel a fire holds
  lightMin: 3.5,         // firelight radius when the fire is nearly out ...
  lightMax: 7.5,         // ... and when it has 60s of fuel or more
  lightSlow: 0.55,       // crabs crawl this much slower in firelight ...
  burnMs: 1500,          // ... and lose 1 health this often
  crabs: 5,              // night crabs on night 1 ...
  crabsGrow: 3,          // ... and this many more every night
  maxCrabs: 26,          // most crabs on the island at once
  crabSpeed: 2.6,        // units/s
  crabHp: 3,             // health on night 1, +1 every 3 nights
  crabSize: 1.3,         // how big crabs are drawn
  crabBite: 1,           // hearts one bite takes
  biteEvery: 1.5,        // seconds between one crab's bites
  aggro: 26,             // crabs hunt survivors closer than this, else head for the fire
  spawnEvery: 1.6,       // seconds between crabs crawling out of the sea
  spawnRadius: 36,       // where they crawl out
  seats: 4,              // bots fill the island up to this many survivors
  botFight: 9,           // at night bots go after crabs closer than this (6 by day)
  botWalls: 12,          // bots stop building fences once the camp has this many
  botFires: 2,           // bots build a second campfire (once they have all three tools) up to this many fires
  botCommit: 6,          // seconds a bot keeps walking to the tree, rock or spot it picked before it rethinks
  maxWalls: 60,          // most fences in the camp
  maxFires: 6,           // most campfires
  wallHp: 4,             // bites a fence takes before it breaks
  costs: { axe: { w: 3 }, pick: { w: 2, s: 2 }, spear: { w: 2, s: 3 }, wall: { w: 2 }, fire: { w: 3, s: 4 } },
  saveNs: "island-camp", // player-save namespace for world memory
  saveEvery: 10000,      // ms between world-memory saves
  board: "night-streak", // leaderboard name
};
// What the recipe bar offers. Tools go in your backpack; fences and campfires go into the camp.
const CRAFTS = [
  { k: "axe", name: "Axe", tool: true },
  { k: "pick", name: "Pickaxe", tool: true },
  { k: "spear", name: "Spear", tool: true },
  { k: "wall", name: "Fence" },
  { k: "fire", name: "Campfire" },
];
const COLORS = ["#ff7b54", "#4ab3ff", "#ffd23f", "#7ee081", "#c792ff", "#ff6fae", "#39d5c9", "#f2f2f2"];
const BOT_NAMES = ["Coco", "Kai", "Mango", "Reef", "Sandy", "Pebble"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'island-survive',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed (and decoded) once per change. Read-only: never mutate what this returns. */
function parseOnce(key, raw, decode) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = decode(parse(raw, null)); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
let player = null; // MP.auth client: world-memory saves + the leaderboard (null offline)
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())
const isHost = () => livePlayers()[0] === net.sessionId && performance.now() >= wakeHold && !(lastFrameAt && performance.now() - lastFrameAt > 1000);

// ── WORLD MEMORY ────────────────────────────────────────────────────────────────────
// A relay room forgets everything when its last player leaves, so the PLAYERS remember the camp:
//   1. Every CONFIG.saveEvery ms and when the page closes, each player saves a copy of the camp
//      (fires, fences, the day count) with its `rev` (how many things PEOPLE built; bots don't
//      count, so a fresh island with bot fences never beats a saved one) to its player save
//      (player.data, namespace CONFIG.saveNs) and to this browser (localStorage). A copy with a
//      higher rev than the live camp is never overwritten: it is kept and offered.
//   2. The first player into an empty room becomes host and loads its copy into shared.
//   3. A player who joins holding a copy with a HIGHER rev than the live camp offers it: it
//      writes the copy into its own entity (`wmh` header, `wm0`, `wm1`… chunks under 2048
//      characters) and the host adopts it. The copy with more building in it wins.
// The game supplies worldSnapshot(), liveRev() (-1 = no camp yet) and loadWorld(world, rev).
const memory = { saved: null, ready: false, cloud: null, lastJson: "", lastSave: 0, offerRev: 0, offerN: 0 };
const memoryKey = () => "mpa-world:" + MP_CONNECT.room + (net.offline ? ":offline" : "");

/** Read my copy: this browser's and my cloud save, whichever has the higher rev. */
async function loadMemory() {
  let best = null;
  try { best = JSON.parse(localStorage.getItem(memoryKey()) || "null"); } catch {}
  if (player) {
    try {
      const doc = (await player.data.get(CONFIG.saveNs)).data;
      if (doc && doc.room === MP_CONNECT.room && doc.world && (!best || doc.rev > best.rev)) best = doc;
      memory.cloud = true;
    } catch (e) { memory.cloud = false; console.warn("World memory: no cloud save, this browser only:", e && e.message); }
  }
  memory.saved = best && best.room === MP_CONNECT.room && best.world && typeof best.rev === "number" ? best : null;
  memory.lastJson = memory.saved ? JSON.stringify(memory.saved.world) : "";
  memory.ready = true;
}

/** Save my copy of the live camp, unless it is unchanged or older than the copy I hold. */
function rememberWorld() {
  if (ATTRACT || !memory.ready) return;
  const rev = liveRev();
  if (rev < 0 || (memory.saved && rev < memory.saved.rev)) return; // mine is newer: keep it, keep offering it
  const doc = { room: MP_CONNECT.room, rev, at: Date.now(), world: worldSnapshot() };
  const json = JSON.stringify(doc.world);
  if (json === memory.lastJson) return;
  memory.lastJson = json; memory.saved = doc;
  try { localStorage.setItem(memoryKey(), JSON.stringify(doc)); } catch {}
  if (player && memory.cloud) {
    player.data.set(doc, { namespace: CONFIG.saveNs })
      .catch((e) => e && e.current ? player.data.set(doc, { namespace: CONFIG.saveNs, version: e.current.version }) : Promise.reject(e))
      .catch((e) => { if (e && (e.status === 401 || e.status === 403)) memory.cloud = false; });
  }
  const tag = document.getElementById("saved");
  if (tag) { tag.classList.add("on"); setTimeout(() => tag.classList.remove("on"), 1600); }
}

/** Once a second: offer my copy if it beats the live camp (the host simply loads it). */
function offerMemory() {
  if (ATTRACT || !memory.ready) return;
  const mine = memory.saved, live = liveRev(), better = mine && mine.rev > live;
  if (isHost()) {
    if (memory.offerRev) clearOffer();
    if (better && live >= 0 && loadWorld(mine.world, mine.rev)) memoryAdopted("");
    return;
  }
  if (better && memory.offerRev !== mine.rev) {
    const json = JSON.stringify(mine.world), fields = {}, n = Math.ceil(json.length / 1900);
    if (n > 40) return; // too big for my entity: keep it for when I am host
    for (let i = 0; i < n; i++) fields["wm" + i] = "~" + json.slice(i * 1900, (i + 1) * 1900); // "~" keeps it a string
    net.me.set(fields);
    net.me.set("wmh", JSON.stringify({ room: MP_CONNECT.room, rev: mine.rev, n })); // header last: chunks land first
    memory.offerRev = mine.rev; memory.offerN = n;
  } else if (!better && memory.offerRev) clearOffer();
}
function clearOffer() {
  const fields = { wmh: "" };
  for (let i = 0; i < memory.offerN; i++) fields["wm" + i] = "";
  net.me.set(fields); memory.offerRev = 0; memory.offerN = 0;
}

/** Host, once a second: adopt the best complete offer that beats the live camp. */
function adoptOffers() {
  let best = null;
  for (const id of livePlayers()) {
    const p = S.entities.players[id], h = id !== net.sessionId && parse(p && p.wmh, null);
    if (!h || h.room !== MP_CONNECT.room || !(h.n <= 40) || !(h.rev > liveRev()) || (best && h.rev <= best.rev)) continue;
    let json = "";
    for (let i = 0; i < h.n && json !== null; i++) { const c = p["wm" + i]; json = typeof c === "string" && c[0] === "~" ? json + c.slice(1) : null; }
    const world = parse(json, null);
    if (world) best = { rev: h.rev, world, name: p.n || "A player" };
  }
  if (best && loadWorld(best.world, best.rev)) memoryAdopted(best.name);
}
function memoryAdopted(name) {
  const text = name ? `${name} brought back the camp they saved` : "Welcome back: your saved camp is here";
  toast(text); net.send("memory", { text: name ? text : "The host brought back the camp they saved" });
}
function memoryTick() {
  offerMemory();
  if (isHost() && !ATTRACT) adoptOffers();
  if (performance.now() - memory.lastSave > CONFIG.saveEvery) { memory.lastSave = performance.now(); rememberWorld(); }
}
addEventListener("pagehide", () => rememberWorld());
document.addEventListener("visibilitychange", () => { if (document.hidden) rememberWorld(); });

// ── ISLAND ──────────────────────────────────────────────────────────────────────────
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r1 = (v) => Math.round(v * 10) / 10, r2 = (v) => Math.round(v * 100) / 100;
const nowSec = () => Date.now() / 1000;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// Trees and rocks sit in the same seeded spots for everyone. NODES[i] is spot i.
const NODES = [];
{
  const r = mulberry32(7), free = (x, z, gap) => NODES.every((n) => Math.hypot(n.x - x, n.z - z) > gap);
  for (let tries = 0, trees = 0; trees < CONFIG.trees && tries < 6000; tries++) {
    const a = r() * TAU, d = 10 + r() * (CONFIG.island - 12), x = Math.sin(a) * d, z = Math.cos(a) * d;
    if (free(x, z, 2.7)) { NODES.push({ kind: "tree", x, z, s: 0.85 + r() * 0.4, max: CONFIG.treeHits, rot: r() * TAU, tone: Math.floor(r() * 3) }); trees++; }
  }
  for (let tries = 0, rocks = 0; rocks < CONFIG.rocks && tries < 6000; tries++) {
    const a = r() * TAU, d = 7.5 + r() * (CONFIG.island - 9), x = Math.sin(a) * d, z = Math.cos(a) * d;
    if (free(x, z, 2.4)) { NODES.push({ kind: "rock", x, z, s: 0.8 + r() * 0.5, max: CONFIG.rockHits, rot: r() * TAU, tone: Math.floor(r() * 3) }); rocks++; }
  }
}

/** A recipe from the bar: a tool into my bag, or a fence/campfire in front of me. */

function syncSurvivors(dt, now) {
  const seen = new Set(), k = 1 - Math.pow(0.0008, dt);

    seen.add(s.id);

    const snap = s.bot && hosting();
    v.x += (s.x - v.x) * (snap ? 1 : k); v.z += (s.z - v.z) * (snap ? 1 : k); v.a += Math.atan2(Math.sin(s.a - v.a), Math.cos(s.a - v.a)) * (snap ? 1 : k);
    if (s.hp < v.hp) burst(v.x, 1.2, v.z, "#ff5d6c", 5, 3);
    v.hp = s.hp;
    poseSurvivor(v.g, { ...s, x: v.x, z: v.z, a: v.a }, now);
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); }
  if (me.g && me.g.userData.color !== me.color) { scene.remove(me.g); me.g = null; }
  if (!me.g) { me.g = makeSurvivor(me.color, ""); me.g.userData.color = me.color; }
  poseSurvivor(me.g, me, now);
}
/** Two people in one color: the one with the higher sessionId picks a color nobody (and no bot) uses. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId);
  if (!others.some(([id, p]) => p.c === me.color && id < net.sessionId)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botList().map((b) => b.color)]), free = COLORS.find((c) => !taken.has(c));
  if (free) { me.color = free; net.me.set("c", free); }
}
// The ring under whatever USE would hit.
const aimRing = mesh(new THREE.RingGeometry(0.75, 0.95, 32), new THREE.MeshBasicMaterial({ color: "#ffffff", transparent: true, opacity: 0.7, depthWrite: false }), 0, 0.07, 0);
aimRing.rotation.x = -Math.PI / 2; scene.add(aimRing);

// ── HUD ─────────────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const costText = (c) => [c.w ? `${c.w} wood` : "", c.s ? `${c.s} stone` : ""].filter(Boolean).join(" + ");
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
document.body.classList.toggle("touch", touchUI);
document.body.classList.toggle("attract", ATTRACT);
let board = null, netDown = false;
const startedAt = performance.now();
CRAFTS.forEach((c, i) => {
  const b = document.createElement("button"); b.dataset.k = c.k;
  b.innerHTML = `${c.name}<small>${[CONFIG.costs[c.k].w ? `${CONFIG.costs[c.k].w}🪵` : "", CONFIG.costs[c.k].s ? `${CONFIG.costs[c.k].s}🪨` : ""].join(" ")}</small>`;
  b.title = `${i + 1}: ${c.name} (${costText(CONFIG.costs[c.k])})`;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); craft(c.k); });
  $("craft").append(b);
});
function toast(text) { const t = $("toast"); t.textContent = text; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3200); }
const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
function hud(s) {
  const now = performance.now();
  $("hurt").style.opacity = now - me.hurtAt < 250 ? 0.8 : me.ko ? 0.4 : 0;
  if (ATTRACT) { $("net").textContent = ""; return; }
  const n = livePlayers().length;
  $("net").textContent = netDown ? "Reconnecting…" : net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the island" : ""}`;
  if (!s) { $("clock").textContent = "Washing ashore…"; return; }
  const left = s.endsAt - Date.now(), camp = campNow(), fire = nearestFire(camp, me.x, me.z, false), low = fire && fuelLeft(fire) < 20;
  $("clock").innerHTML = s.phase === "day" ? `☀️ Day ${s.day}<small>Night falls in ${mmss(left)}</small>` : `🌙 Night ${s.day}<small>${low ? "The fire is going out! Feed it wood" : `Dawn in ${mmss(left)}`}</small>`;
  $("hearts").innerHTML = "<b>♥</b>".repeat(Math.max(0, me.hp)) + "<i>♥</i>".repeat(Math.max(0, CONFIG.hp - me.hp));
  $("bag").innerHTML = `🪵 ${me.w} &nbsp;🪨 ${me.s}<small>${[me.axe && "Axe", me.pick && "Pickaxe", me.spear && "Spear"].filter(Boolean).join(" · ") || "Bare hands"}${me.streak ? ` · ${me.streak} night streak` : ""}</small>`;
  for (const b of $("craft").children) {
    const k = b.dataset.k, c = CONFIG.costs[k], have = CRAFTS.find((x) => x.k === k).tool && me[k];
    b.classList.toggle("have", !!have); b.classList.toggle("can", !have && (c.w || 0) <= me.w && (c.s || 0) <= me.s);
  }
  $("team").innerHTML = team().map((p) => `<div class="${p === me ? "mine" : ""} ${p.ko ? "ko" : ""}">${esc(p === me ? "You" : p.name)} ${p.ko ? "zzz" : "♥".repeat(Math.max(0, p.hp))}<i style="background:${esc(p.color)}"></i></div>`).join("");
  const hint = $("hint"), early = now - startedAt < 11000;
  hint.textContent = touchUI ? "Left thumb walks · hold USE to chop, mine, fight and feed the fire · tap a recipe to craft" : "WASD to walk · hold click or Space to chop, mine, fight and feed the fire · 1–5 to craft";
  hint.classList.toggle("on", early);
  if (me.ko) $("koNext").textContent = `You wake up by the fire in ${Math.max(0, Math.ceil((me.wk - Date.now()) / 1000))}s`;
}
function showBoard() {
  const list = $("board");
  // Status lines get class "msg" so they don't show up as a numbered entry.
  if (!board) { list.innerHTML = `<li class="msg">Leaderboards need a connection.</li>`; return; }
  list.innerHTML = `<li class="msg">Loading…</li>`;
  board.top(10).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score} night${e.score === 1 ? "" : "s"}</span></li>`).join("") : `<li class="msg">No streaks yet. Last a night to be first.</li>`;
  }).catch(() => { list.innerHTML = `<li class="msg">Couldn't load the leaderboard.</li>`; });
}
$("wake").onclick = wakeMe;

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const keys = new Set(), mouse = { x: 0, y: 0, seen: false, down: false };
const MOVE = { w: [0, -1], arrowup: [0, -1], s: [0, 1], arrowdown: [0, 1], a: [-1, 0], arrowleft: [-1, 0], d: [1, 0], arrowright: [1, 0] };
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (MOVE[k] || k === " ") e.preventDefault();
  keys.add(k);
  const n = Number((/^(Digit|Numpad)(\d)$/.exec(e.code) || [])[2] || e.key); // by code, so Shift+1 still crafts
  if (n >= 1 && n <= CRAFTS.length && !e.repeat) craft(CRAFTS[n - 1].k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); mouse.down = false; });
for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
const cv = renderer.domElement;
// Touch: the left half of the screen is a thumb stick, the right half (and the USE button) swings.
const touch = { stick: null, use: null };
cv.addEventListener("contextmenu", (e) => e.preventDefault()); // a right-click on the island doesn't open the browser menu
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (e.pointerType === "mouse") { if (e.button === 0) mouse.down = true; return; }
  if (e.clientX < innerWidth / 2 && !touch.stick) {
    touch.stick = { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 };
    Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
  } else if (!touch.use) touch.use = e.pointerId;
});
cv.addEventListener("pointermove", (e) => {
  if (e.pointerType === "mouse") { mouse.x = e.clientX; mouse.y = e.clientY; mouse.seen = true; return; }
  const s = touch.stick;
  if (s && s.id === e.pointerId) {
    let dx = e.clientX - s.x0, dy = e.clientY - s.y0; const d = Math.hypot(dx, dy);
    if (d > 50) { dx *= 50 / d; dy *= 50 / d; }
    s.dx = dx; s.dy = dy; $("stick").firstChild.style.transform = `translate(${dx}px, ${dy}px)`;
  }
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => {
  if (e.pointerType === "mouse") { if (e.button === 0) mouse.down = false; return; }
  if (touch.stick && touch.stick.id === e.pointerId) { touch.stick = null; $("stick").hidden = true; }
  if (touch.use === e.pointerId) touch.use = null;
});
const useBtn = $("use");
useBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); touch.use = e.pointerId; });
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), aimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.1), aimAt = new THREE.Vector3();
/** Turn keys, mouse and touch into this frame's move, facing and USE. Facing comes through the camera that drew the frame. */
function readInput() {
  input.mx = input.mz = 0;
  for (const k of keys) if (MOVE[k]) { input.mx += MOVE[k][0]; input.mz += MOVE[k][1]; }
  if (touch.stick) { input.mx = touch.stick.dx / 50; input.mz = touch.stick.dy / 50; }
  if (mouse.seen && !touch.stick) {
    ndc.set(mouse.x / innerWidth * 2 - 1, -(mouse.y / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
    if (ray.ray.intersectPlane(aimPlane, aimAt) && Math.hypot(aimAt.x - me.x, aimAt.z - me.z) > 0.3) me.a = Math.atan2(aimAt.x - me.x, aimAt.z - me.z);
  } else if (Math.hypot(input.mx, input.mz) > 0.2) me.a = Math.atan2(input.mx, input.mz);
  input.use = mouse.down || keys.has(" ") || keys.has("e") || touch.use !== null;
  if (me.ko) input.mx = input.mz = 0;
}

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
const focus = new THREE.Vector3(), camOff = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.acting = host.adopted = false; host.lastSky = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the island meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now;
  const t = now / 1000;
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.acting = host.adopted = false;
  const s = sky();
  if (!ATTRACT) readInput();
  if (s) { phaseTick(s); myTick(dt); }
  const camp = campNow(), light = daylight(s), night = 1 - light;
  syncNodes(dt); syncWalls(camp); syncFires(camp, t, night);
  syncCrabs(dt); drawCrabs(dt, t); syncSurvivors(dt, now); stepBits(dt);
  applySky(light);
  waveTex.offset.set(t * 0.004, t * 0.002);
  aimRing.visible = !ATTRACT && !!me.target && !me.ko;
  if (aimRing.visible) { aimRing.position.x = me.target.x; aimRing.position.z = me.target.z; aimRing.material.color.set(me.target.kind === "crab" ? "#ff6b6b" : me.target.kind === "fire" ? "#ffc04a" : "#ffffff"); }
  if (ATTRACT) { // the preview: a slow orbit around the camp
    const a = t * 0.1 + 0.2;
    focus.set(0, 0, 0); camera.position.set(Math.sin(a) * 10.5, 8, Math.cos(a) * 10.5); camera.lookAt(0, 0.3, 0);
  } else { // a 3/4 camera that follows me (higher and wider on a phone held upright)
    const tall = innerHeight > innerWidth ? 1.45 : 1;
    camOff.set(0, 16, 9).multiplyScalar(tall);
    focus.lerp(P3.set(me.x, 0, me.z), 1 - Math.pow(0.002, dt));
    camera.position.copy(focus).add(camOff);
    if (now - me.hurtAt < 200) camera.position.x += (Math.random() - 0.5) * 0.4;
    camera.lookAt(focus);
  }
  sun.position.set(focus.x + 18, 34, focus.z + 12); sun.target.position.copy(focus);
  renderer.render(scene, camera);
  if (now - lastHud > 120) { lastHud = now; hud(s); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("hit", (m, from) => { if (hosting() && m && Number.isInteger(m.i)) applyNodeHit(m.i); });
  net.on("hitc", (m) => { if (hosting() && m && typeof m.i === "number") applyCrabHit(m.i, Number(m.d) || 1, Number(m.x) || 0, Number(m.z) || 0); });
  net.on("fuel", (m) => { if (hosting() && m) applyFuel(Number(m.x), Number(m.z)); });
  net.on("build", (m) => { if (hosting() && m) applyBuild({ k: m.k, x: Number(m.x), z: Number(m.z), r: Number(m.r) }, true); });
  net.on("bite", (m) => { if (m && m.to === net.sessionId) applyBite(clamp(Number(m.d) || 0, 0, CONFIG.hp)); });
  net.on("memory", (m) => { if (m && typeof m.text === "string") toast(m.text.slice(0, 80)); });
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") { player = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }); board = player.leaderboard(CONFIG.board); }
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...readBots().map((b) => b.color)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now(), st: 0 });
  if (ATTRACT) {
    Object.assign(CONFIG, { seats: 3, firstDayMs: 1600, nightMs: 60000, duskMs: 1500, spawnEvery: 0.2, crabs: 30, maxCrabs: 22, spawnRadius: 12, crabSpeed: 2.6, burnMs: 1100, botFight: 4.5 });
    Object.assign(me, { w: 6, s: 4, axe: 1, pick: 1, spear: 1, x: 2, z: 2.5 });
    memory.ready = true;
  } else loadMemory();
  setInterval(memoryTick, 1000);
  requestAnimationFrame(frame);
})();
